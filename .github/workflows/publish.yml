name: Publish v2.0 release (one-time bootstrap)

# The GitHub API tools used to update this repo can only upload text files,
# so the signed APK (built and signed locally, versionCode 2) was uploaded as base64.
# This workflow decodes it, verifies the SHA-256, creates Release v2.0 with the APK,
# removes the payload and fast-forwards gh-pages to main. It does NOT build or sign anything.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify APK
        run: |
          set -euo pipefail
          test -f .github/bootstrap/ten-klinka-v2.apk.b64 || { echo "payload already processed"; exit 0; }
          mkdir -p /tmp/p
          base64 -d .github/bootstrap/ten-klinka-v2.apk.b64 > /tmp/p/ten-klinka.apk
          echo "$(cat .github/bootstrap/ten-klinka-v2.apk.sha256)  /tmp/p/ten-klinka.apk" | sha256sum -c -
          echo "0763704fd5f82b99e18d401a247fd2e56c2ccc700a61d8981484368b7f72e5d1  /tmp/p/ten-klinka.apk" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v2.0 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/ten-klinka.apk || exit 0
          gh release view v2.0 >/dev/null 2>&1 && { echo "release exists"; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Тень Клинка» 2.0 — большое обновление (устанавливается поверх 1.0, та же подпись).

          - Главное меню: Сюжет, Мультиплеер, Настройки.
          - Сюжет: 9 глав «Саги о датском веке» — Ульф, Сигрид, Бьёрн, Харальд, Торкелл, Торфинн, Аскеладд, Кнуд и финальный босс Торс; открытие бойцов и оружия.
          - 10 бойцов и 7 видов оружия: меч, топор, копьё, два меча, датская секира, сакс, парные кинжалы.
          - Мультиплеер: рейтинговые бои с поиском соперника, кубками и лигами (соперники — боты, игра офлайн), профиль и награды-скины; дуэль вдвоём на одном телефоне; тренировка с ИИ.
          - Настройки: звук, музыка, эффекты, сложность, тряска, подсказки, размер/прозрачность кнопок, сброс прогресса.

          Android 7.0+, пакет com.luntikvisuals.tenklinka, versionCode 2.
          SHA-256: 0763704fd5f82b99e18d401a247fd2e56c2ccc700a61d8981484368b7f72e5d1
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.0 /tmp/p/ten-klinka.apk --target main --latest --title "Тень Клинка v2.0" --notes-file /tmp/notes.md

      - name: Remove payload, update gh-pages
        run: |
          set -euo pipefail
          test -f /tmp/p/ten-klinka.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -r .github/bootstrap
          git commit -m "Remove v2.0 bootstrap payload (APK published in Release v2.0)"
          git push origin HEAD:main
          git push origin HEAD:gh-pages

      - name: Request Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request not permitted; the push to gh-pages should trigger it."
