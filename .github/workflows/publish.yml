name: Publish v3.0 release (one-time bootstrap)

# The GitHub API tools used to update this repo can only upload text files,
# so the signed APK (built and signed locally, versionCode 3) was uploaded as base64.
# This workflow decodes it, verifies the SHA-256, creates Release v3.0 with the APK,
# removes the payload and fast-forwards gh-pages to main. It does NOT build or sign anything.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify APK
        run: |
          set -euo pipefail
          test -f .github/bootstrap/ten-klinka-v3.apk.b64 || { echo "payload already processed"; exit 0; }
          mkdir -p /tmp/p
          base64 -d .github/bootstrap/ten-klinka-v3.apk.b64 > /tmp/p/ten-klinka.apk
          echo "$(cat .github/bootstrap/ten-klinka-v3.apk.sha256)  /tmp/p/ten-klinka.apk" | sha256sum -c -
          echo "97b4419bec20cf4d13a43d768bb2c74c86ec15e7955b9b1baebee12fe962f923  /tmp/p/ten-klinka.apk" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v3.0 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/ten-klinka.apk || exit 0
          gh release view v3.0 >/dev/null 2>&1 && { echo "release exists"; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Тень Клинка» 3.0 — большое обновление (устанавливается поверх 2.0 и 1.0, та же подпись; кубки и открытые в сюжете бойцы/оружие сохраняются).

          - Свой ник (2–16 символов) и аватар из галереи: в профиле, меню, карточке соперника и результатах.
          - Монеты, руны и лавка: бойцы и оружие покупаются или выпадают из сундуков. Пять редкостей (Обычный → Мифический) с цветными рамками; Тень с мечом бесплатно; дубликаты превращаются в руны и монеты.
          - Улучшения до 10 уровня для бойцов, оружия и доспехов, характеристики видны на карточках.
          - 5 доспехов без шлемов (кожа, гамбезон, кольчуга, ламеллы, Чешуя Фафнира): защита и скорость, видны на силуэте.
          - Сундуки: обычный, редкий и легендарный, шансы показаны, есть анимация открытия.
          - «Путь к славе»: 30 наград за кубки, от 25 до 4000.
          - Ярость: при полной шкале — приём, свой для каждого оружия («Гнев Одина», «Ярость берсерка», «Копьё Гунгнира», «Вихрь клинков», «Удар тени»).
          - Задания дня с монетами и сундуками.
          - Новые арены: палуба драккара, снежная крепость, Лондонский мост 1014. Можно выбрать или играть на случайной.
          - Режим «Выживание»: здоровье между боями восстанавливается лишь частично, рекорд сохраняется.
          - Android: выбор фото из галереи, кнопка «Назад» внутри игры.

          Android 7.0+, пакет com.luntikvisuals.tenklinka, versionCode 3.
          SHA-256: 97b4419bec20cf4d13a43d768bb2c74c86ec15e7955b9b1baebee12fe962f923
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v3.0 /tmp/p/ten-klinka.apk --target main --latest --title "Тень Клинка v3.0" --notes-file /tmp/notes.md

      - name: Remove payload, update gh-pages
        run: |
          set -euo pipefail
          test -f /tmp/p/ten-klinka.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -r .github/bootstrap
          git commit -m "Remove v3.0 bootstrap payload (APK published in Release v3.0)"
          git push origin HEAD:main
          git push origin HEAD:gh-pages

      - name: Request Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request not permitted; the push to gh-pages should trigger it."
