.rline,.rfill{position:absolute;height:8px;margin-top:-4px;border-radius:4px;left:0}
.rline{background:rgba(255,255,255,.13)}
.rfill{background:linear-gradient(90deg,#9c6a28,#ffd27a);box-shadow:0 0 10px rgba(255,200,100,.55)}
.rme{position:absolute;margin-top:-30px;transform:translateX(-50%);font-size:11px;color:#1b0f06;background:#ffd27a;border-radius:8px;padding:1px 6px;white-space:nowrap;z-index:2}
.rn2{position:relative;width:104px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:1}
.rbx{background:rgba(10,10,14,.72);border:2px solid var(--rc);border-radius:9px;width:92px;height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;line-height:1.2;padding:2px;box-sizing:border-box;text-align:center;color:#e8dcc0}
.rbx .ic{font-size:30px;line-height:1.15}.rbx canvas{width:76px;height:auto}
.rdot{width:16px;height:16px;border-radius:50%;background:#2a2218;border:2px solid #b8925a;margin:6px 0 1px}
.rn2.got .rdot{background:#ffd27a;border-color:#fff2c0;box-shadow:0 0 8px #ffd27a}
.rt{font-size:12px;color:#ffd27a}
.rn2 .sbtn{font-size:11px;padding:.2em .6em;margin:0}
.rn2.can .rbx{animation:glw 1.2s ease-in-out infinite}
@keyframes glw{50%{box-shadow:0 0 18px var(--rc)}}
.rn2.cl .rbx{opacity:.5}
.qs{display:flex;flex-direction:column;gap:6px;max-width:780px;margin:0 auto;width:100%;flex:1;min-height:0;overflow:auto}
.q{display:flex;align-items:center;gap:10px;background:rgba(10,10,14,.62);border:1px solid rgba(232,220,192,.25);border-radius:8px;padding:5px 10px}
.q .qi{font-size:24px;width:30px}.q .qt{flex:1;text-align:left;font-size:13px}.q .qt small{color:#bba987}
.q.done{border-color:#9fe09a;background:rgba(30,50,20,.55)}.q.cl{opacity:.5}
.qbar{height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:3px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#4a8a3a,#9fe09a)}
.qr{font-size:12px;color:#ffe2a0;white-space:nowrap}.q .sbtn{margin:0}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 44px);transform:translateX(-50%) translateY(-16px);background:rgba(20,14,8,.94);border:1px solid #f0c060;border-radius:16px;padding:5px 14px;font-size:13px;color:#ffe2a0;z-index:12;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.arn{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1;align-content:center;max-width:960px;margin:0 auto;width:100%}
.arc{border-radius:9px;border:2px solid rgba(232,220,192,.35);color:#f6e8c8;font:bold 12px Georgia,serif;cursor:pointer;background:rgba(10,10,14,.6);padding:3px 3px 6px;touch-action:manipulation}
.arc canvas{width:100%;height:auto;display:block;border-radius:6px;margin-bottom:4px;background:#222}
.arc.sel{border-color:#f0c060;box-shadow:0 0 12px rgba(240,192,96,.6)}
.mrow{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px}
.mrow .sbtn{position:relative}
.loadout{font-size:12px;color:#bba987}
.rwline{display:inline-flex;gap:12px;align-items:center;justify-content:center;font-size:clamp(13px,4vmin,18px);color:#ffe2a0;margin:2px 0 4px}
.prof .row2{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}

let AC=null,NB=null,master=null,sfxG=null,musG=null;const mus={on:false,next:0,step:0};
function initAudio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.connect(AC.destination);sfxG=AC.createGain();sfxG.connect(master);musG=AC.createGain();musG.connect(master);
  NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;applyAudio();}
  if(AC.state==='suspended'&&!document.hidden)AC.resume();}catch(e){AC=null;}}
function applyAudio(){if(!AC)return;master.gain.value=S.sound?0.55:0;sfxG.gain.value=S.sfx;musG.gain.value=S.music*0.6;}
function noise(dur,type,f0,f1,vol,q){const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(fl);fl.connect(g);g.connect(sfxG);s.start(t);s.stop(t+dur+0.05);}
function tone(f0,dur,type,vol,f1){const t=AC.currentTime;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1||f0,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+dur+0.05);}
function sfx(n){if(!AC||!S.sound||S.sfx<0.01)return;try{switch(n){
case 'swish':noise(0.17,'bandpass',450,2800,0.32,1.4);break;
case 'heavy':noise(0.26,'bandpass',220,1400,0.4,1.2);break;
case 'whoosh':noise(0.14,'bandpass',300,900,0.28,1);break;
case 'hit':noise(0.13,'lowpass',2000,250,0.6);tone(120,0.2,'sine',0.55,45);break;
case 'clang':tone(1320,0.3,'triangle',0.22,1240);tone(1990,0.2,'square',0.05,1900);noise(0.09,'highpass',2500,6000,0.3);break;
case 'thud':tone(75,0.3,'sine',0.7,38);noise(0.18,'lowpass',600,90,0.45);break;
case 'jump':noise(0.1,'bandpass',300,700,0.12);break;
case 'ui':tone(660,0.08,'triangle',0.12,520);break;
case 'gong':tone(196,1.4,'sine',0.32,192);tone(294,1.0,'sine',0.14,290);tone(392,0.6,'triangle',0.05,390);break;
case 'rage':tone(92,0.7,'sawtooth',0.28,46);noise(0.6,'lowpass',900,120,0.5);tone(184,0.5,'square',0.05,92);break;
case 'boom':tone(58,0.6,'sine',0.85,30);noise(0.5,'lowpass',800,60,0.6);break;
case 'coin':tone(1320,0.09,'triangle',0.14,1320);tone(1760,0.18,'triangle',0.1,1760);break;
case 'chest':noise(0.08,'bandpass',600,1200,0.25);tone(220,0.08,'square',0.05,200);break;
case 'open':tone(523,0.25,'triangle',0.16,523);tone(659,0.35,'triangle',0.12,659);tone(784,0.6,'triangle',0.12,784);noise(0.4,'highpass',3000,8000,0.12);break;
}}catch(e){}}
// procedural music: drone + frame drum + pentatonic plucks (scheduled ahead)
function startDrone(){if(mus.on)return;mus.on=true;const t=AC.currentTime;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=240;lp.Q.value=2.5;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+3);lp.connect(g);g.connect(musG);
  for(const[f,dt]of[[73.42,0],[110,4],[73.42,-7]]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start();}
  const l=AC.createOscillator();l.frequency.value=0.06;const lg=AC.createGain();lg.gain.value=110;l.connect(lg);lg.connect(lp.frequency);l.start();}
const SCALE=[146.83,174.61,196,220,261.63,293.66,349.23,392];
function drum(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(42,t+0.25);g.gain.setValueAtTime(0.55*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);o.connect(g);g.connect(musG);o.start(t);o.stop(t+0.4);}
function pluck(f,t,v){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.11*v,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+1.6);o.connect(g);g.connect(musG);o.start(t);o.stop(t+1.7);}
function musicTick(){if(!AC||AC.state!=='running'||!S.sound||S.music<0.02)return;startDrone();const now=AC.currentTime,st=60/88/2;if(mus.next<now)mus.next=now+0.05;
  const fight=G.mode==='fight'||G.mode==='intro'||G.mode==='ko';
  while(mus.next<now+0.2){const s=mus.step++,t=mus.next;mus.next+=st;
    if(fight){const b=s%8;if(b===0)drum(t,1);else if(b===3||b===4)drum(t,0.5);else if(b===6)drum(t,0.3);}
    if(s%4===0&&Math.random()<(fight?0.45:0.3)){const f=SCALE[(Math.random()*SCALE.length)|0]*(Math.random()<0.3?0.5:1);pluck(f,t,fight?1:0.8);}
    if(s%32===0)pluck(73.42*2,t,0.7);}}

  const saveNick=()=>{const v=cleanNick($('nkIn').value);if(Array.from(v).length<2){toast('Ник: 2–16 символов (буквы, цифры, пробел, _ . -)');return;}RK.nick=v;saveRK();toast('Ник сохранён: '+v);scrProfile();};
  on('bBack',back);on('bNkOk',saveNick);on('bNick',()=>{RK.nick=genNick();saveRK();scrProfile();});
  $('nkIn').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();saveNick();}});
  on('bAv',()=>{RK.avatar=(RK.avatar+1)%AVATARS.length;saveRK();setAvatarImg(null);scrProfile();});on('bAvDel',()=>{setAvatarImg(null);scrProfile();});

/* ================= ECONOMY: inventory, shop, upgrades, cases, Trophy Road, daily quests, survival ================= */
const MAXLV=10,RM=[1,1.5,2.2,3,4];
const KINDS={
  char:{list:ROSTER,data:CHARS,inv:'chars',rar:id=>CH_RAR[id]||0,price:id=>CH_PRICE[id]||0,one:'Боец'},
  weapon:{list:WLIST,data:WEAPONS,inv:'weapons',rar:id=>W_RAR[id]||0,price:id=>W_PRICE[id]||0,one:'Оружие'},
  armor:{list:ALIST.filter(a=>a!=='none'),data:ARMORS,inv:'armors',rar:id=>ARMORS[id].rar,price:id=>ARMORS[id].price,one:'Доспех'}};
const CASES={
  common:{n:'Обычный сундук',price:300,col:'#a7b0ba',r:0,drops:[['coins',50,80,200],['runes',25,3,8],['weapon',10],['armor',8],['char',7]],rar:[[0,70],[1,30]]},
  rare:{n:'Редкий сундук',price:900,col:'#4da6ff',r:1,drops:[['coins',35,250,600],['runes',25,10,20],['weapon',15],['armor',13],['char',12]],rar:[[1,70],[2,30]]},
  legend:{n:'Легендарный сундук',price:2400,col:'#ffb02e',r:3,drops:[['coins',20,800,1600],['runes',20,25,45],['weapon',20],['armor',18],['char',22]],rar:[[2,55],[3,35],[4,10]]}};
const RUNE_PACK={n:10,price:450},DUP_R=[5,10,20,35,60],DUP_C=[50,100,200,350,600];
const DROP_N={coins:'🪙 Монеты',runes:'ᚱ Руны',weapon:'⚔ Оружие',armor:'🛡 Доспех',char:'👤 Боец'};
const IKEY='tenKlinka.v3.inventory',QKEY='tenKlinka.v3.quests',VKEY='tenKlinka.v3.survival',AKEY='tenKlinka.v3.avatar';
const hadV2=(()=>{try{return localStorage.getItem(PKEY)!==null||localStorage.getItem(RKEY)!==null;}catch(e){return false;}})();
function newInv(){return{v:3,coins:300,runes:10,chars:{ten:{lvl:1}},weapons:{sword:{lvl:1}},armors:{},eq:{char:'ten',weapon:'sword',armor:'none'},cases:{common:1,rare:0,legend:0},road:[],storyPaid:0,opened:0,migrated:false,migNote:false};}
function fixInv(v){const d=newInv();for(const k in d)if(v[k]==null||typeof v[k]!==typeof d[k])v[k]=d[k];
  v.coins=Math.max(0,Math.floor(+v.coins||0));v.runes=Math.max(0,Math.floor(+v.runes||0));
  for(const kind in KINDS){const o=v[KINDS[kind].inv];for(const id in o){if(!KINDS[kind].data[id]||id==='none'||!o[id]||typeof o[id]!=='object'){delete o[id];continue;}o[id].lvl=clamp(Math.floor(+o[id].lvl||1),1,MAXLV);}}
  if(!v.chars.ten)v.chars.ten={lvl:1};if(!v.weapons.sword)v.weapons.sword={lvl:1};
  if(!v.chars[v.eq.char])v.eq.char='ten';if(!v.weapons[v.eq.weapon])v.eq.weapon='sword';if(v.eq.armor!=='none'&&!v.armors[v.eq.armor])v.eq.armor='none';
  for(const c in CASES)v.cases[c]=Math.max(0,Math.floor(+v.cases[c]||0));if(!Array.isArray(v.road))v.road=[];return v;}
function loadInv(){let v=null;try{v=JSON.parse(localStorage.getItem(IKEY)||'null');}catch(e){v=null;}
  if(v&&typeof v==='object'&&!Array.isArray(v))return fixInv(v);
  v=newInv();
  if(hadV2){ // migrate a v2 save: story-unlocked fighters & weapons become owned, trophies stay, bonus coins
    const un=unlocks(PR.beaten);for(const c of un.chars)if(CHARS[c])v.chars[c]={lvl:1};for(const w of un.weapons)if(WEAPONS[w])v.weapons[w]={lvl:1};
    v.coins=600+Math.min(3000,(RK.wins||0)*25+(PR.beaten||0)*150);v.runes=25;v.cases.rare=1;v.migrated=true;v.storyPaid=PR.beaten||0;
    v.eq.char=v.chars[RK.char]?RK.char:v.chars[PR.char]?PR.char:'ten';v.eq.weapon=v.weapons[RK.weapon]?RK.weapon:v.weapons[PR.weapon]?PR.weapon:'sword';}
  v=fixInv(v);store(IKEY,v);return v;}
let INV=loadInv();
function saveInv(){store(IKEY,INV);}
function owned(kind,id){return kind==='armor'&&id==='none'?true:!!INV[KINDS[kind].inv][id];}
function lvlOf(kind,id){if(kind==='armor'&&id==='none')return 1;const o=INV[KINDS[kind].inv][id];return o?o.lvl:1;}
function rarOf(kind,id){return kind==='armor'&&id==='none'?0:KINDS[kind].rar(id);}
function itemName(kind,id){return KINDS[kind].data[id].name;}
function upCost(kind,id,lvl){const m=RM[rarOf(kind,id)];return{coins:Math.round(90*m*Math.pow(1.42,lvl-1)/10)*10,runes:Math.ceil(lvl*m)};}
function charStats(id,lvl,bal){const b=bal.chars[id]||{hp:100,spd:1,dmg:1},u=bal.upg.char,l=(lvl||1)-1;return{hp:Math.round(b.hp*(1+u.hp*l)),spd:b.spd,dmg:b.dmg*(1+u.dmg*l)};}
function weaponStats(id,lvl,bal){const b=bal.weapons[id]||{dmg:1,spd:1},u=bal.upg.weapon,l=(lvl||1)-1;return{dmg:b.dmg*(1+u.dmg*l),spd:b.spd*(1+u.spd*l)};}
function armorStats(id,lvl,bal){const b=bal.armors[id]||bal.armors.none,u=bal.upg.armor,l=id==='none'||!bal.armors[id]?0:(lvl||1)-1;return{def:b.def+u.def*l,spd:b.spd};}
function myLoadout(){const e=INV.eq;return{cid:e.char,wid:e.weapon,arm:e.armor,lv:{c:lvlOf('char',e.char),w:lvlOf('weapon',e.weapon),a:lvlOf('armor',e.armor)}};}
function loadoutText(){const e=INV.eq;return`${CHARS[e.char].name} ур.${lvlOf('char',e.char)} · ${WEAPONS[e.weapon].name} ур.${lvlOf('weapon',e.weapon)} · ${e.armor==='none'?'без доспеха':ARMORS[e.armor].name+' ур.'+lvlOf('armor',e.armor)}`;}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function rarStyle(r){return`--rc:${RAR[r].c};--rg:${hexA(RAR[r].c,0.22)}`;}
function curHTML(){return`<span class="cur">🪙 <b>${INV.coins}</b> <span class="rn">ᚱ <b>${INV.runes}</b></span></span>`;}
function addCoins(n){INV.coins=Math.max(0,INV.coins+Math.round(n));saveInv();}
let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}
// ---- nickname & avatar ----
let AVIMG=null;try{const a=localStorage.getItem(AKEY);if(a&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(a))AVIMG=a;}catch(e){}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cleanNick(x){x=String(x||'').normalize('NFC').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,'').replace(/[^\p{L}\p{N}\p{M} _.\-]/gu,'').replace(/\s+/g,' ').trim();return Array.from(x).slice(0,16).join('').trim();}
function myNick(){return esc(RK.nick);}
function avHTML(cls){return AVIMG?`<img class="${cls||'avi'}" src="${AVIMG}" alt="">`:cls==='avbig'?`<span class="avbig">${AVATARS[RK.avatar]}</span>`:`<span class="av">${AVATARS[RK.avatar]}</span>`;}
function setAvatarImg(d){try{if(d)localStorage.setItem(AKEY,d);else localStorage.removeItem(AKEY);AVIMG=d;return true;}catch(e){toast('Не удалось сохранить фото: мало места');return false;}}
function avatarFromFile(file,done){if(!file)return;if(file.type&&!/^image\//.test(file.type)){toast('Это не изображение');return;}if(file.size>30e6){toast('Файл слишком большой');return;}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{try{const N=128,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),w=img.naturalWidth,h=img.naturalHeight,m=Math.min(w,h);
      g.imageSmoothingQuality='high';g.drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,N,N); // centre square crop → 128×128
      const d=c.toDataURL('image/jpeg',0.86);if(setAvatarImg(d)){toast('Аватар обновлён');sfx('coin');}}catch(e){toast('Не удалось обработать изображение');}
    URL.revokeObjectURL(url);if(done)done();};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось открыть изображение');};img.src=url;}
$('avFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];avatarFromFile(f,()=>{if(G.afterAvatar)G.afterAvatar();});});
// ---- rewards ----
function grantItem(kind,id){const r=rarOf(kind,id);if(owned(kind,id)){INV.runes+=DUP_R[r];INV.coins+=DUP_C[r];saveInv();return{dup:true,runes:DUP_R[r],coins:DUP_C[r]};}INV[KINDS[kind].inv][id]={lvl:1};saveInv();return{dup:false};}
function grantReward(r){
  if(r.coins){addCoins(r.coins);return{icon:'🪙',text:`+${r.coins} монет`};}
  if(r.runes){INV.runes+=r.runes;saveInv();return{icon:'ᚱ',text:`+${r.runes} рун`};}
  if(r.case){INV.cases[r.case]+=(r.n||1);saveInv();return{icon:'📦',text:`${CASES[r.case].n}${r.n>1?' ×'+r.n:''}`};}
  for(const kind of['char','weapon','armor'])if(r[kind]){const g=grantItem(kind,r[kind]);return{kind,id:r[kind],dup:g.dup,runes:g.runes,coins:g.coins,text:`${KINDS[kind].one} «${itemName(kind,r[kind])}»${g.dup?` (дубликат → +${g.runes} ᚱ, +${g.coins} 🪙)`:''}`};}
  return{text:''};}
function rewardText(r){if(r.coins)return`${r.coins} монет`;if(r.runes)return`${r.runes} рун`;if(r.case)return CASES[r.case].n+(r.n>1?' ×'+r.n:'');for(const k of['char','weapon','armor'])if(r[k])return itemName(k,r[k]);return'';}
function rewardRar(r){if(r.case)return CASES[r.case].r;for(const k of['char','weapon','armor'])if(r[k])return rarOf(k,r[k]);return r.coins>=1500?3:r.coins>=600?1:r.runes>=30?2:r.runes?1:0;}
function rewardIcon(r){return r.coins?'🪙':r.runes?'ᚱ':r.case?'📦':r.char?'👤':r.weapon?'⚔':'🛡';}
function itemPortrait(cv,kind,id,o){o=o||{};const e=INV.eq;if(kind==='char')portrait(cv,id,e.weapon,Object.assign({vh:250,dx:-24,arm:e.armor},o));else if(kind==='weapon')portrait(cv,e.char,id,Object.assign({vh:270,dx:-30},o));else portrait(cv,e.char,e.weapon,Object.assign({vh:250,dx:-24,arm:id},o));}
// ---- shop / arsenal ----
function buyItem(kind,id){if(owned(kind,id))return false;const p=KINDS[kind].price(id);if(INV.coins<p){toast('Не хватает монет 🪙');return false;}INV.coins-=p;INV[KINDS[kind].inv][id]={lvl:1};INV.eq[kind]=id;saveInv();sfx('coin');toast(`Куплено: ${itemName(kind,id)}`);return true;}
function upgradeItem(kind,id){if(!owned(kind,id)||(kind==='armor'&&id==='none'))return false;const o=INV[KINDS[kind].inv][id];if(o.lvl>=MAXLV)return false;const c=upCost(kind,id,o.lvl);
  if(INV.coins<c.coins||INV.runes<c.runes){toast(INV.coins<c.coins?'Не хватает монет 🪙':'Не хватает рун ᚱ — они в сундуках и за дубликаты');return false;}
  INV.coins-=c.coins;INV.runes-=c.runes;o.lvl++;saveInv();sfx('coin');qEvent('upg',1);toast(`${itemName(kind,id)}: уровень ${o.lvl}!`);return true;}
function equip(kind,id){if(!owned(kind,id))return false;INV.eq[kind]=id;saveInv();return true;}
function statInfo(kind,id,lvl){const bal=BALANCE.mp;
  if(kind==='char'){const c=charStats(id,lvl,bal),cr=CHAR_RAGE[id]||{};return{bars:[['Жизнь',(c.hp-60)/110],['Урон',(c.dmg-0.6)/0.8],['Скор.',(c.spd-0.6)/0.7]],txt:[`жизнь ${c.hp}`,`урон ×${c.dmg.toFixed(2)}`,`скорость ${c.spd.toFixed(2)}`],extra:(cr.gain||cr.dmg)?`Ярость: ${[cr.gain?'копится ×'+cr.gain:'',cr.dmg?'урон приёма ×'+cr.dmg:''].filter(Boolean).join(', ')}${cr.n?' · приём «'+cr.n+'»':''}`:''};}
  if(kind==='weapon'){const w=weaponStats(id,lvl,bal),Wp=WEAPONS[id];return{bars:[['Урон',(w.dmg-0.4)/1.3],['Скор.',(w.spd-0.5)/1.0],['Даль',(Wp.len+30)/160]],txt:[`урон ×${w.dmg.toFixed(2)}`,`скорость ×${w.spd.toFixed(2)}`,`длина ${Wp.len}`],extra:`Приём ярости «${SPECIALS[Wp.sp].n}»: ${SPECIALS[Wp.sp].d}`};}
  const a=armorStats(id,lvl,bal);return{bars:[['Защ.',a.def/0.26],['Скор.',(a.spd+0.06)/0.06]],txt:[`защита −${(a.def*100).toFixed(0)}% урона`,`скорость ${a.spd?Math.round(a.spd*100)+'%':'без потерь'}`],extra:ARMORS[id].desc};}
function shopTabs(tab){return`<div class="tabs">${[['char','👤 Бойцы'],['weapon','⚔ Оружие'],['armor','🛡 Доспехи'],['case','📦 Сундуки']].map(t=>`<button class="sbtn${t[0]===tab?' on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}${tab==='armor'?`<button class="sbtn${INV.eq.armor==='none'?' on':''}" id="bNoArm">Без доспеха</button>`:''}</div>`;}
function bindTabs(back){for(const b of ov.querySelectorAll('.tabs [data-t]'))b.onclick=()=>{initAudio();sfx('ui');scrShop(b.dataset.t,back);};}
function scrShop(tab,back,selId){tab=tab||'char';back=back||G.shopBack||scrMenu;G.shopBack=back;if(tab==='case'){scrCases(back);return;}
  const K=KINDS[tab];let sel=selId||INV.eq[tab];if(!K.list.includes(sel))sel=K.list[0];
  let h=`<div class="scr"><div class="hdr"><button class="sbtn" id="bBack">← Назад</button><div class="ttl">Лавка и арсенал</div>${curHTML()}</div>${shopTabs(tab)}<div class="grid gshop">`;
  for(const id of K.list){const own=owned(tab,id),r=rarOf(tab,id),lv=lvlOf(tab,id),eq=INV.eq[tab]===id,si=statInfo(tab,id,lv);
    h+=`<button class="card rar${own?'':' no'}${id===sel?' sel':''}" style="${rarStyle(r)}" data-id="${id}"><canvas width="200" height="96"></canvas><div class="nm">${K.data[id].name}</div><div class="rr" style="color:${RAR[r].c}">${RAR[r].n}</div><div class="lv">${own?`Ур. ${lv}/${MAXLV}`:'не куплено'}</div>${bars(si.bars)}<div class="pr${own?' own':''}">${eq?'✓ выбрано':own?'в арсенале':'🪙 '+K.price(id)}</div></button>`;}
  showOv(h+`</div><div class="det" id="det"></div></div>`);
  for(const b of ov.querySelectorAll('.card')){const id=b.dataset.id;itemPortrait(b.querySelector('canvas'),tab,id,{vh:tab==='weapon'?250:230});
    b.onclick=()=>{initAudio();sfx('ui');sel=id;for(const c of ov.querySelectorAll('.card'))c.classList.toggle('sel',c.dataset.id===sel);det();};}
  const det=()=>{const id=sel,own=owned(tab,id),r=rarOf(tab,id),lv=lvlOf(tab,id),si=statInfo(tab,id,lv),d=K.data[id];let st=si.txt.join(' · ');
    if(own&&lv<MAXLV){const nx=statInfo(tab,id,lv+1);st=si.txt.map((t,i)=>t===nx.txt[i]?t:`${t} <span class="up">→ ${nx.txt[i].replace(/^[^\d×−+]*/,'')}</span>`).join(' · ');}
    let btn='';
    if(!own){const p=K.price(id);btn=`<button class="mbtn sm" id="dBuy"${INV.coins<p?' style="filter:grayscale(.8);opacity:.6"':''}>Купить 🪙 ${p}</button>`;}
    else{if(INV.eq[tab]!==id)btn+=`<button class="mbtn sm" id="dEq">${tab==='armor'?'Надеть':'Выбрать'}</button> `;
      if(lv<MAXLV){const c=upCost(tab,id,lv),ok=INV.coins>=c.coins&&INV.runes>=c.runes;btn+=`<button class="mbtn sm" id="dUp"${ok?'':' style="filter:grayscale(.8);opacity:.6"'}>⬆ Ур. ${lv+1}: 🪙${c.coins} ᚱ${c.runes}</button>`;}else btn+=`<span class="lv">✦ Макс. уровень</span>`;}
    $('det').innerHTML=`<div class="dt"><b>${d.name}</b> <span style="color:${RAR[r].c}">· ${RAR[r].n}</span>${own?` · ур. ${lv}/${MAXLV}`:''}${tab==='char'?' — '+d.title:''}<br>${st}${si.extra?'<br><small>'+si.extra+'</small>':''}</div>${btn}`;
    on('dBuy',()=>{if(buyItem(tab,id))scrShop(tab,back,id);});on('dEq',()=>{equip(tab,id);sfx('ui');scrShop(tab,back,id);});on('dUp',()=>{if(upgradeItem(tab,id))scrShop(tab,back,id);});};
  det();on('bBack',back);bindTabs(back);on('bNoArm',()=>{INV.eq.armor='none';saveInv();scrShop('armor',back,sel);});}
// ---- cases ----
function chestSVG(col,w){return`<svg width="${w}" height="${Math.round(w*0.82)}" viewBox="0 0 100 82" style="overflow:visible"><g><rect x="10" y="38" width="80" height="40" rx="3" fill="#3a2614" stroke="#120a04" stroke-width="2"/><rect x="10" y="38" width="80" height="40" rx="3" fill="${col}" opacity=".32"/><path d="M12 52H88M12 65H88" stroke="#1a0f06" stroke-width="1.2" opacity=".7"/><rect x="20" y="38" width="7" height="40" fill="#2a2a2e" stroke="#0e0e10"/><rect x="73" y="38" width="7" height="40" fill="#2a2a2e" stroke="#0e0e10"/><rect x="43" y="44" width="14" height="16" rx="2" fill="${col}" stroke="#120a04" stroke-width="1.5"/><circle cx="50" cy="51" r="2.2" fill="#120a04"/></g><g class="lid"><path d="M8 40V27Q50 4 92 27V40Z" fill="#4a3018" stroke="#120a04" stroke-width="2"/><path d="M8 40V27Q50 4 92 27V40Z" fill="${col}" opacity=".35"/><path d="M20 40V19.5M27 40V16.5M73 40V16.5M80 40V19.5" stroke="#2a2a2e" stroke-width="7" opacity=".9"/></g></svg>`;}
function wpick(arr,wi){let t=0;for(const a of arr)t+=a[wi];let q=Math.random()*t;for(const a of arr){q-=a[wi];if(q<=0)return a;}return arr[arr.length-1];}
function rollCase(cid){const C=CASES[cid],d=wpick(C.drops,1),k=d[0];
  if(k==='coins')return{coins:Math.round((d[2]+Math.random()*(d[3]-d[2]))/10)*10};
  if(k==='runes')return{runes:d[2]+((Math.random()*(d[3]-d[2]+1))|0)};
  for(let r=wpick(C.rar,1)[0];r>=0;r--){const pool=KINDS[k].list.filter(id=>rarOf(k,id)===r);if(pool.length)return{[k]:rnd(pool)};}
  return{coins:100};}
function openCase(cid){if(INV.cases[cid]>0)INV.cases[cid]--;else{if(INV.coins<CASES[cid].price){toast('Не хватает монет 🪙');return null;}INV.coins-=CASES[cid].price;}
  INV.opened=(INV.opened||0)+1;const r=rollCase(cid),g=grantReward(r);saveInv();qEvent('case',1);return{r,g};}
function scrCases(back){back=back||G.shopBack||scrMenu;G.shopBack=back;
  let h=`<div class="scr"><div class="hdr"><button class="sbtn" id="bBack">← Назад</button><div class="ttl">Лавка · сундуки</div>${curHTML()}</div>${shopTabs('case')}<div class="chests">`;

function genQuests(day){const R=rng(hashStr(day+'|tk3')),types=Object.keys(QT),list=[];let guard=0;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

}
