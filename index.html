<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080b;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:Georgia,'Times New Roman',serif;color:#e8dcc0}

#ctl.pvp #k1{right:calc(env(safe-area-inset-right,0px) + 10px + (clamp(74px,23vmin,104px) - clamp(58px,17vmin,80px))*var(--bs)/2);bottom:calc(24px + clamp(74px,23vmin,104px)*var(--bs))}

#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(8,10,14,.35),rgba(0,0,0,.85));z-index:5;overflow:auto}
#ov.on{display:flex}
.panel{text-align:center;padding:2vmin 4vmin;max-width:92vw}

.mbtn{font:bold clamp(16px,5.6vmin,28px) Georgia,serif;color:#1b0f06;background:linear-gradient(#f6dfa3,#c18c3c);border:2px solid #f8e7bf;border-radius:7px;padding:.35em 1.4em;margin:.22em;box-shadow:0 4px 0 #5a3a12,0 8px 24px rgba(0,0,0,.6);letter-spacing:.05em;cursor:pointer;touch-action:manipulation}

.help{font-size:clamp(10px,2.9vmin,13px);color:#b5a888;margin-top:.7em;line-height:1.45;text-shadow:0 1px 2px #000;max-width:660px;margin-left:auto;margin-right:auto}

.hdr{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}

.chap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1;min-height:0;overflow:auto;align-content:start}
.ch{font:inherit;text-align:left;background:rgba(10,10,14,.62);border:1px solid rgba(232,220,192,.28);border-radius:8px;padding:6px 10px;color:#e8dcc0;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;gap:1px}
.ch b{font-size:11px;color:#b9a27a;letter-spacing:.12em;text-transform:uppercase;font-weight:normal}.ch span{font-size:clamp(13px,3.9vmin,17px);color:#f0d8a0}.ch i{font-size:11px;color:#bba987}

.ch.done span{color:#cfc3a3}.ch.lock{opacity:.4;cursor:default}
.ib{display:flex;align-items:center;gap:16px;max-width:840px;margin:auto;padding:6px 14px}
.ib canvas{width:min(34vw,240px);height:auto;flex:none}
.it{text-align:left}.it p{font-size:clamp(12px,3.7vmin,16px);line-height:1.4;color:#e3d6b8;margin:.4em 0 .6em;font-style:italic;text-shadow:0 1px 2px #000}
.foe{font-size:clamp(12px,3.6vmin,16px);color:#ff9d80}.foe small{color:#bba987}
.you{font-size:12px;color:#bba987;margin-bottom:.4em}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;max-width:780px;margin:0 auto;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,14,.55);border:1px solid rgba(232,220,192,.18);border-radius:7px;padding:3px 8px;font-size:clamp(12px,3.5vmin,15px)}
.row .v{display:flex;align-items:center;gap:4px}.row .v b{min-width:5.6em;text-align:center;font-weight:normal;color:#f0d8a0}
.row .sbtn{margin:0;padding:.2em .7em}
.rbig{grid-column:1/3;justify-content:center;gap:12px}
.danger{border-color:#c0504a!important;color:#ffb0a0!important}

.lob{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;width:100%;flex:1;min-height:0}
.lobL{display:flex;align-items:center;gap:14px}.lobI{min-width:230px}
.lob canvas{height:min(36vh,150px);width:auto}
.nick{font-size:clamp(14px,4.3vmin,19px);color:#f6e8c8;font-weight:bold}.av{font-size:1.15em}
.lg{font-size:clamp(12px,3.6vmin,16px);margin:2px 0;display:flex;align-items:center;gap:5px;justify-content:center}.lobI .lg{justify-content:flex-start}
.tr{font-size:clamp(15px,4.6vmin,22px);color:#ffd27a}.tr small{font-size:11px;color:#bba987}
.lp{height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:4px}.lp i{display:block;height:100%;background:linear-gradient(90deg,#9c6a28,#f0c060)}
.lpt{font-size:11px;color:#bba987;margin-top:2px}
.mm{position:relative;width:110px;height:110px;margin:6px auto}
.ring{position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:#f0c060;border-right-color:rgba(240,192,96,.4);animation:spin 1s linear infinite}
.ring.r2{inset:16px;border-top-color:#c62a1a;border-left-color:rgba(198,42,26,.4);animation-duration:1.6s;animation-direction:reverse}

.vs{display:flex;align-items:center;justify-content:center;gap:18px;flex:1;min-height:0}
.vsc{background:rgba(10,10,14,.62);border:1px solid rgba(240,192,96,.45);border-radius:10px;padding:6px 10px;text-align:center;width:min(36vw,280px)}
.vsc canvas{height:min(34vh,140px);width:auto}.cw{font-size:12px;color:#bba987}
.vsx{font-size:clamp(30px,10vmin,54px);font-weight:bold;color:#ff8a5a;text-shadow:0 3px 0 #000,0 0 18px #000;font-style:italic}
.tch{font-size:clamp(30px,10vmin,52px);font-weight:bold;text-shadow:0 3px 0 #000}.tch.up{color:#ffd27a}.tch.dn{color:#d9584a}
.lup{display:inline-flex;align-items:center;gap:10px;text-align:left;background:rgba(70,48,18,.6);border:1px solid #f0c060;border-radius:8px;padding:5px 12px;margin:2px 0 6px;font-size:13px}
.prof{display:flex;gap:16px;flex:1;min-height:0;overflow:auto;max-width:900px;margin:0 auto;width:100%}
.prof>div:first-child{flex:1.2}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}.stg div{background:rgba(10,10,14,.6);border:1px solid rgba(232,220,192,.2);border-radius:7px;padding:4px 6px;font-size:11px;color:#bba987}.stg b{display:block;font-size:17px;color:#f0d8a0;font-weight:normal}.stg small{font-size:10px}
.skins{display:flex;flex-wrap:wrap;gap:2px}.skin{font-size:11px!important;display:inline-flex;align-items:center;gap:5px}.skin i{width:10px;height:10px;border-radius:50%;display:inline-block}.skin.on{border-color:#f0c060;background:rgba(70,48,18,.7)}
.ladder2{flex:1;display:flex;flex-direction:column;gap:3px}.lad{display:flex;align-items:center;gap:8px;background:rgba(10,10,14,.55);border:1px solid rgba(232,220,192,.15);border-radius:7px;padding:2px 8px;font-size:12px}.lad small{color:#bba987;font-size:10px}.lad.cur{border-color:#f0c060;background:rgba(70,48,18,.55)}
</style>

<body>
<canvas id="c"></canvas>
<div id="ctl" class="single">
  <div id="pad0"><div class="zone" id="z0"><div class="ptag">ИГРОК 1</div><div class="joy" id="j0"><span class="arw" style="left:50%;top:5px;transform:translateX(-50%)">▲</span><span class="arw" style="left:50%;bottom:5px;transform:translateX(-50%)">▼</span><span class="arw" style="left:6px;top:50%;transform:translateY(-50%)">◀</span><span class="arw" style="right:6px;top:50%;transform:translateY(-50%)">▶</span><div class="knob" id="n0"></div></div></div>
    <div class="btn bK" id="k0">Нога</div><div class="btn bS" id="s0">Удар</div></div>
  <div id="pad1"><div class="zone" id="z1"><div class="ptag">ИГРОК 2</div><div class="joy" id="j1"><span class="arw" style="left:50%;top:5px;transform:translateX(-50%)">▲</span><span class="arw" style="left:50%;bottom:5px;transform:translateX(-50%)">▼</span><span class="arw" style="left:6px;top:50%;transform:translateY(-50%)">◀</span><span class="arw" style="right:6px;top:50%;transform:translateY(-50%)">▶</span><div class="knob" id="n1"></div></div></div>
    <div class="btn bK" id="k1">Нога</div><div class="btn bS" id="s1">Удар</div></div>

</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),mainCtx=cv.getContext('2d');let ctx=mainCtx;
const H=460,GROUND=400,WORLD_W=1500,GRAV=1900,PI=Math.PI;
let W=1,HS=1,dpr=1,scale=1,viewW=1000,viewH=460,offY=0,camX=(WORLD_W-1000)/2;
let layers=[],fogImg=null,fogW=900,vigImg=null;
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t*t*(3-2*t);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= DATA: CHARACTERS & WEAPONS (visuals / movesets) ================= */
// acc: visual features of the silhouette (all original shapes)
const CHARS={
  ten:     {name:'Тень',title:'наёмник без имени',desc:'Сбалансированный боец, хорош с любым оружием.',scale:1,bulk:1,acc:['band'],eye:'#ffb347'},
  hilda:   {name:'Хильда',fem:true,title:'охотница из Хедебю',desc:'Лёгкая и быстрая, но держит меньше ударов.',scale:0.93,bulk:0.86,acc:['braid'],eye:'#7fe3ff'},
  einar:   {name:'Эйнар',title:'следопыт в капюшоне',desc:'Чуть быстрее Тени, ловок и вынослив.',scale:0.98,bulk:0.95,acc:['hood'],eye:'#9fff8a'},
  brand:   {name:'Бранд',title:'кузнец из Рибе',desc:'Крепкий и сильный, но медленный.',scale:1.1,bulk:1.22,acc:['nasal','beard'],eye:'#ffcf6a'},
  bjorn:   {name:'Бьёрн',title:'берсерк в медвежьей шкуре',desc:'Свирепый воин: мощь и запас здоровья.',scale:1.08,bulk:1.16,acc:['pelt','beard'],eye:'#ff6a3a'},
  thorfinn:{name:'Торфинн',title:'юный мститель',desc:'Самый быстрый: сальто в прыжке, молниеносные атаки.',scale:0.9,bulk:0.82,acc:['spiky'],eye:'#ffd84a',flip:true},
  askeladd:{name:'Аскеладд',title:'хитрый вожак наёмников',desc:'Мастер контратаки: быстрый и точный.',scale:1.0,bulk:0.96,acc:['short','beard','cloak'],eye:'#b48cff'},
  thorkell:{name:'Торкелл',title:'великан из Йомсборга',desc:'Огромный драчун: море здоровья, тяжёлые удары, медленный.',scale:1.24,bulk:1.4,acc:['bald','beard','bigbeard'],eye:'#ff3b2f'},
  knud:    {name:'Кнуд',title:'принц датчан',desc:'Холодный и расчётливый, ровный во всём.',scale:1.02,bulk:0.95,acc:['crown','long','cape'],eye:'#e8e0ff'},
  thors:   {name:'Торс',title:'Тролль из Йомсборга',desc:'Живая легенда: сила, скорость и выдержка.',scale:1.12,bulk:1.18,acc:['tail','beard'],eye:'#ffffff'},
  ulf:     {name:'Ульф Бродяга',title:'изгнанник с болот Ютландии',scale:1,bulk:1,acc:['hood'],eye:'#ffb347'},
  sigrid:  {name:'Сигрид Ловчая',fem:true,title:'щитовая дева из Роскилле',scale:0.95,bulk:0.9,acc:['braid'],eye:'#7fe3ff'},
  harald:  {name:'Харальд Ярл',title:'ярл теней, хозяин Еллинга',scale:1.1,bulk:1.12,acc:['helm','cape'],eye:'#ff3b2f'}
};
const ROSTER=['ten','hilda','einar','brand','bjorn','thorfinn','askeladd','thorkell','knud','thors'];
// combo: chain of moves for repeated «Удар»; fwd/up/down: direction + «Удар»
const WEAPONS={
  sword:  {name:'Меч',desc:'Универсальный клинок: серия из 3 ударов, выпад, удар сверху.',kind:'sword',len:84,back:12,combo:['slash1','slash2','slash3'],fwd:'lunge',up:'overhead',down:'lowSlash'},

let AC=null,NB=null,master=null,sfxG=null,musG=null;const mus={on:false,next:0,step:0};
function initAudio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.connect(AC.destination);sfxG=AC.createGain();sfxG.connect(master);musG=AC.createGain();musG.connect(master);
  NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;applyAudio();}
  if(AC.state==='suspended'&&!document.hidden)AC.resume();}catch(e){AC=null;}}
function applyAudio(){if(!AC)return;master.gain.value=S.sound?0.55:0;sfxG.gain.value=S.sfx;musG.gain.value=S.music*0.6;}
function noise(dur,type,f0,f1,vol,q){const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(fl);fl.connect(g);g.connect(sfxG);s.start(t);s.stop(t+dur+0.05);}
function tone(f0,dur,type,vol,f1){const t=AC.currentTime;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1||f0,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+dur+0.05);}
function sfx(n){if(!AC||!S.sound||S.sfx<0.01)return;try{switch(n){
case 'swish':noise(0.17,'bandpass',450,2800,0.32,1.4);break;
case 'heavy':noise(0.26,'bandpass',220,1400,0.4,1.2);break;
case 'whoosh':noise(0.14,'bandpass',300,900,0.28,1);break;
case 'hit':noise(0.13,'lowpass',2000,250,0.6);tone(120,0.2,'sine',0.55,45);break;
case 'clang':tone(1320,0.3,'triangle',0.22,1240);tone(1990,0.2,'square',0.05,1900);noise(0.09,'highpass',2500,6000,0.3);break;
case 'thud':tone(75,0.3,'sine',0.7,38);noise(0.18,'lowpass',600,90,0.45);break;
case 'jump':noise(0.1,'bandpass',300,700,0.12);break;
case 'ui':tone(660,0.08,'triangle',0.12,520);break;
case 'gong':tone(196,1.4,'sine',0.32,192);tone(294,1.0,'sine',0.14,290);tone(392,0.6,'triangle',0.05,390);break;
}}catch(e){}}
// procedural music: drone + frame drum + pentatonic plucks (scheduled ahead)
function startDrone(){if(mus.on)return;mus.on=true;const t=AC.currentTime;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=240;lp.Q.value=2.5;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+3);lp.connect(g);g.connect(musG);
  for(const[f,dt]of[[73.42,0],[110,4],[73.42,-7]]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start();}
  const l=AC.createOscillator();l.frequency.value=0.06;const lg=AC.createGain();lg.gain.value=110;l.connect(lg);lg.connect(lp.frequency);l.start();}
const SCALE=[146.83,174.61,196,220,261.63,293.66,349.23,392];
function drum(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(42,t+0.25);g.gain.setValueAtTime(0.55*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);o.connect(g);g.connect(musG);o.start(t);o.stop(t+0.4);}
function pluck(f,t,v){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.11*v,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+1.6);o.connect(g);g.connect(musG);o.start(t);o.stop(t+1.7);}
function musicTick(){if(!AC||AC.state!=='running'||!S.sound||S.music<0.02)return;startDrone();const now=AC.currentTime,st=60/88/2;if(mus.next<now)mus.next=now+0.05;
  const fight=G.mode==='fight'||G.mode==='intro'||G.mode==='ko';
  while(mus.next<now+0.2){const s=mus.step++,t=mus.next;mus.next+=st;
    if(fight){const b=s%8;if(b===0)drum(t,1);else if(b===3||b===4)drum(t,0.5);else if(b===6)drum(t,0.3);}
    if(s%4===0&&Math.random()<(fight?0.45:0.3)){const f=SCALE[(Math.random()*SCALE.length)|0]*(Math.random()<0.3?0.5:1);pluck(f,t,fight?1:0.8);}
    if(s%32===0)pluck(73.42*2,t,0.7);}}

for(const n in MV){MV[n].dur=MV[n].k[MV[n].k.length-1][0];}
function pickMove(F,k,dir,air){const Wp=F.W;if(air)return k==='J'?'airSlash':'airKick';
  if(k==='J')return dir==='up'?Wp.up:dir==='down'?Wp.down:dir==='fwd'?Wp.fwd:Wp.combo[0];
  return dir==='up'?'highKick':dir==='down'?'sweep':dir==='fwd'?'sideKick':'kick';}
function animPose(a){let pt=0,pp=a.k0;for(const[tt,pn]of a.mv.k){const p=POSE[pn];if(a.t<=tt){const u=ease(clamp((a.t-pt)/Math.max(1,tt-pt),0,1));const r={};for(const k of PK)r[k]=pp[k]+(p[k]-pp[k])*u;return r;}pt=tt;pp=p;}return Object.assign({},pp);}
function limb(p,a,L,f){return{x:p.x+Math.sin(a)*L*f,y:p.y+Math.cos(a)*L};}
function ik(s,t,L1,L2,f){let dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1;const md=L1+L2-0.5;if(d>md){dx*=md/d;dy*=md/d;d=md;}
  const a=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)),th=Math.atan2(dy,dx)+a*f;
  return[{x:s.x+Math.cos(th)*L1,y:s.y+Math.sin(th)*L1},{x:s.x+dx,y:s.y+dy}];}

class Rope{
  constructor(n,len,x,y){this.len=len;this.p=[];for(let i=0;i<n;i++)this.p.push({x,y:y+i*len,px:x,py:y+i*len});}
  update(ax,ay,dt,g,wind){const Q=this.p;Q[0].x=ax;Q[0].y=ay;const d2=dt*dt;
    for(let i=1;i<Q.length;i++){const q=Q[i];const vx=(q.x-q.px)*0.92,vy=(q.y-q.py)*0.92;q.px=q.x;q.py=q.y;q.x+=vx+wind*d2;q.y+=vy+g*d2;}
    for(let it=0;it<4;it++)for(let i=1;i<Q.length;i++){const a=Q[i-1],b=Q[i];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,df=(d-this.len)/d;if(i===1){b.x-=dx*df;b.y-=dy*df;}else{a.x+=dx*df*0.5;a.y+=dy*df*0.5;b.x-=dx*df*0.5;b.y-=dy*df*0.5;}}
    for(const q of Q)if(q.y>GROUND+2)q.y=GROUND+2;}
  snap(ax,ay){for(let i=0;i<this.p.length;i++){const q=this.p[i];q.x=q.px=ax;q.y=q.py=ay+i*this.len;}}
}

/* ================= FIGHTER ================= */
class Fighter{
  constructor(o){
    this.cid=o.cid;this.C=CHARS[o.cid];this.wid=o.wid;this.W=WEAPONS[o.wid];
    const cs=o.cs||{hp:100,spd:1,dmg:1},ws=o.ws||{dmg:1,spd:1};
    this.name=this.C.name;this.maxHp=this.hp=this.hpLag=cs.hp;this.sc=this.C.scale;this.bulk=this.C.bulk;this.spd=cs.spd;this.dmg=cs.dmg;this.wdmg=ws.dmg;this.wspd=ws.spd;
    this.eye=o.eye||null;this.side=o.side||0;this.hpLagT=0;this.ai=null;
    this.acc={};for(const a of this.C.acc)this.acc[a]=true;
    this.reach=(70+this.W.len)*this.sc;
    this.x=o.x;this.y=GROUND;this.vx=0;this.vy=0;this.face=o.face;this.st='free';this.anim=null;this.pose=Object.assign({},POSE.guard);this.rot=0;this.airT=0;
    this.ctrl={left:false,right:false,up:false,down:false,strikeEdge:false,kickEdge:false};
    this.buf=null;this.jumpPend=0;this.upPrev=false;this.ph=0;this.br=Math.random()*6;this.stunT=0;this.downT=0;this.dead=false;this.flash=0;this.blocking=false;this.crouching=false;this.trail=[];
    this.computeJ();this.prevJ=this.J;
    const A=this.acc,k=this.sc,J=this.J;
    if(A.band)this.rope=new Rope(6,7.5*k,J.head.x,J.head.y);else if(A.braid)this.rope=new Rope(6,6.5*k,J.head.x,J.head.y);
    else if(A.tail)this.rope=new Rope(5,7*k,J.head.x,J.head.y);else if(A.long)this.rope=new Rope(5,8.5*k,J.head.x,J.head.y);
    if(A.helm||A.cape||A.cloak||A.pelt)this.cape=new Rope(A.cloak?5:A.pelt?6:7,(A.pelt?10:11)*k,J.sh.x,J.sh.y);
  }
  setAnim(name,st,ci){const mv=MV[name];this.anim={name,mv,t:0,k0:Object.assign({},this.pose),hit:false,ci:ci==null?null:ci,sp:mv.w==='wpn'?this.wspd:1};if(st)this.st=st;}
  startMove(name,ci){this.rot=0;this.setAnim(name,MV[name].air?'airatk':'attack',ci);}
  computeJ(){
    const p=this.pose,f=this.face,k=this.sc,Wp=this.W,an=this.anim,wpnAtk=!!(an&&an.mv.w==='wpn'),both=!!(an&&an.mv.both),hip={x:0,y:0};
    const neck=limb(hip,PI-p.t,SK.T*k,f),head=limb(neck,PI-p.t-p.h,(SK.NK+SK.HR)*k,f);
    const sh={x:neck.x*0.9,y:neck.y*0.9};
    const el1=limb(sh,p.a1,SK.UA*k,f),ha1=limb(el1,p.a1+p.e1,SK.FA*k,f),sa=p.a1+p.e1+p.s;
    const tip=limb(ha1,sa,Wp.len*k,f),pom=limb(ha1,sa+PI,Wp.back*k,f);
    let el2,ha2,tip2=null,pom2=null;
    if(Wp.two){const ux=tip.x-ha1.x,uy=tip.y-ha1.y,L=Math.hypot(ux,uy)||1;const r=ik(sh,{x:ha1.x+ux/L*Wp.grip*k,y:ha1.y+uy/L*Wp.grip*k},SK.UA*k,SK.FA*k,f);el2=r[0];ha2=r[1];}
    else{let a2=p.a2,e2=p.e2;
      if(Wp.dual){if(wpnAtk&&!both){a2=p.a1-0.55;e2=p.e1+0.35;}else if(!wpnAtk&&this.st!=='down'&&this.st!=='fall'){a2=p.a2+0.45;}}
      el2=limb(sh,a2,SK.UA*k,f);ha2=limb(el2,a2+e2,SK.FA*k,f);
      if(Wp.dual){const s2=a2+e2+(both?p.s:0.5);tip2=limb(ha2,s2,Wp.len2*k,f);pom2=limb(ha2,s2+PI,Wp.back*k,f);}}
    const kn1=limb(hip,p.l1,SK.TH*k,f),ft1=limb(kn1,p.l1+p.k1,SK.SH*k,f),toe1=limb(ft1,p.l1+p.k1+PI/2,11*k,f);
    const kn2=limb(hip,p.l2,SK.TH*k,f),ft2=limb(kn2,p.l2+p.k2,SK.SH*k,f),toe2=limb(ft2,p.l2+p.k2+PI/2,11*k,f);
    const all={hip,neck,head,sh,el1,ha1,tip,pom,el2,ha2,kn1,ft1,toe1,kn2,ft2,toe2};
    if(tip2){all.tip2=tip2;all.pom2=pom2;}
    if(this.rot){const c=Math.cos(this.rot*f),s=Math.sin(this.rot*f),cy=-40*k;for(const n in all){const q=all[n],x=q.x,y=q.y-cy;all[n]={x:x*c-y*s,y:x*s+y*c+cy};}}
    const A=all,bot=Math.max(A.ft1.y,A.ft2.y,A.toe1.y,A.toe2.y,A.kn1.y+6*k,A.kn2.y+6*k,A.head.y+SK.HR*k,A.ha1.y+4*k,A.ha2.y+4*k,A.neck.y+9*k,A.hip.y+10*k,A.el1.y+5*k,A.el2.y+5*k);
    const ox=this.x,oy=this.y-bot,J={};
    for(const n in all)J[n]={x:all[n].x+ox,y:all[n].y+oy};
    this.J=J;
  }
  update(dt,o){
    const c=this.ctrl;
    if(this.buf){this.buf.t-=dt;if(this.buf.t<=0)this.buf=null;}
    if(c.strikeEdge)this.buf={k:'J',t:0.25};
    if(c.kickEdge)this.buf={k:'K',t:0.25};
    if(this.st==='free'&&Math.abs(o.x-this.x)>2)this.face=o.x>=this.x?1:-1;
    const f=this.face,fwdH=f>0?c.right:c.left,backH=f>0?c.left:c.right;
    const dirNow=(c.up||this.jumpPend>0)?'up':c.down?'down':fwdH?'fwd':'n';
    this.flash=Math.max(0,this.flash-dt);
    let target=null;this.blocking=false;
    switch(this.st){
    case 'free':{
      this.crouching=c.down;
      if(this.buf){this.jumpPend=0;const nm=pickMove(this,this.buf.k,dirNow,false);this.startMove(nm,this.buf.k==='J'&&dirNow==='n'?0:null);this.buf=null;break;}
      if(c.up&&!this.upPrev&&!c.down)this.jumpPend=0.085;
      if(this.jumpPend>0){this.jumpPend-=dt;if(this.jumpPend<=0){this.jumpPend=0;this.st='air';this.airT=0;const fl=this.C.flip?1.1:1;this.vy=-680*fl;this.vx=(fwdH?210:backH?-180:0)*f*fl;sfx('jump');break;}}
      this.blocking=backH;
      let vx=0;if(!c.down){if(fwdH)vx=165*f*this.spd;else if(backH)vx=-125*f*this.spd;}
      this.vx=vx;
      const base=c.down?(backH?POSE.cblock:POSE.crouch):(backH?POSE.block:POSE.guard);
      target=Object.assign({},base);
      if(vx!==0){this.ph+=dt*9.5*(fwdH?1:-1)*this.spd;const s=Math.sin(this.ph),co=Math.cos(this.ph);target.l1=base.l1+0.42*s;target.k1=base.k1-0.55*Math.max(0,co);target.l2=base.l2-0.42*s;target.k2=base.k2-0.55*Math.max(0,-co);target.t+=fwdH?0.06:-0.02;}
      else{this.br+=dt*2.4;const b=Math.sin(this.br)*0.03;target.t+=b;target.a1+=b*1.5;target.e1-=b;target.h-=b;}
      break;}
    case 'attack':{
      const an=this.anim,mv=an.mv;let sp=0;
      if(mv.mv)for(const m of mv.mv)if(an.t>=m[0]&&an.t<m[1])sp=m[2];
      this.vx=sp?sp*f*Math.min(1.15,this.spd):this.vx*Math.exp(-14*dt);
      this.crouching=mv.type==='low';
      if(this.buf&&mv.cancel&&an.t>=mv.cancel){let nm,ci=null;const cb=this.W.combo;
        if(this.buf.k==='J'&&dirNow==='n'&&an.ci!=null&&an.ci<cb.length-1){ci=an.ci+1;nm=cb[ci];}
        else{nm=pickMove(this,this.buf.k,dirNow,false);if(this.buf.k==='J'&&dirNow==='n')ci=0;}
        this.buf=null;this.startMove(nm,ci);}
      break;}
    case 'air':this.airT+=dt;if(this.C.flip)this.rot=clamp(this.airT/0.68,0,1)*PI*2;
      if(this.buf){this.startMove(this.buf.k==='J'?'airSlash':'airKick');this.buf=null;}target=POSE.jump;break;
    case 'hit':this.stunT-=dt;if(this.stunT<=0){this.st='free';this.anim=null;}break;
    case 'blockstun':this.blocking=true;this.stunT-=dt;target=this.crouching?POSE.cblock:POSE.block;if(this.stunT<=0)this.st='free';break;
    case 'down':this.downT-=dt;if(this.downT<=0&&!this.dead)this.setAnim('getup','getup');break;
    }
    if(this.st!=='air')this.rot=0;
    const airSt=this.st==='air'||this.st==='airatk'||this.st==='fall';
    if(airSt){this.vy+=GRAV*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.y>=GROUND&&this.vy>0){this.y=GROUND;this.land();}}
    else{this.y=GROUND;this.x+=this.vx*dt;if(this.st!=='free'&&this.st!=='attack')this.vx*=Math.exp(-7*dt);}
    if(this.anim){const an=this.anim,pt=an.t;an.t+=dt*1000*an.sp;
      if(an.mv.act&&pt<an.mv.act[0]&&an.t>=an.mv.act[0])sfx(an.mv.w==='leg'?'whoosh':(this.W.kind==='daneaxe'||this.W.kind==='axe')?'heavy':'swish');
      this.pose=animPose(an);
      if(!an.mv.hold&&an.t>=an.mv.dur){this.anim=null;if(this.st==='attack'||this.st==='getup')this.st='free';}
    }else{const tp=target||POSE.guard,r=1-Math.exp(-dt*(this.st==='free'?16:22));for(const k of PK)this.pose[k]+=(tp[k]-this.pose[k])*r;}
    this.upPrev=c.up;
    this.prevJ=this.J;this.computeJ();
    const J=this.J,an=this.anim;
    if(an&&an.mv.w==='wpn'&&an.t>=an.mv.act[0]-30&&an.t<=an.mv.act[1]+30){this.trail.push({tx:J.tip.x,ty:J.tip.y,mx:lerp(J.ha1.x,J.tip.x,0.4),my:lerp(J.ha1.y,J.tip.y,0.4),a:0});}
    for(const p of this.trail)p.a+=dt;while(this.trail.length&&this.trail[0].a>0.13)this.trail.shift();
    this.updRopes(dt);
    if(this.hpLagT>0)this.hpLagT-=dt;else this.hpLag=Math.max(this.hp,this.hpLag-dt*30);
  }
  updRopes(dt){const J=this.J,f=this.face,k=this.sc,R=SK.HR*k,A=this.acc,tm=performance.now()/1000,wv=Math.sin(tm*3+this.x*0.01)*300;
    if(this.rope){if(A.band)this.rope.update(J.head.x-f*R*0.8,J.head.y-3*k,dt,250,-f*1100+wv);
      else if(A.braid)this.rope.update(J.head.x-f*R*0.8,J.head.y+2*k,dt,800,-f*350+wv);
      else if(A.tail)this.rope.update(J.head.x-f*R*0.7,J.head.y-R*0.6,dt,700,-f*500+wv);
      else this.rope.update(J.head.x-f*R*0.75,J.head.y-R*0.1,dt,900,-f*300+wv*0.6);}
    if(this.cape)this.cape.update(J.sh.x-f*5*k,J.sh.y+3,dt,1000,-f*(this.acc.pelt?300:600)+Math.sin(tm*2.3)*300);}
  settle(){const J=this.J;if(this.rope)this.rope.snap(J.head.x,J.head.y);if(this.cape)this.cape.snap(J.sh.x,J.sh.y);for(let i=0;i<50;i++)this.updRopes(1/60);}
  land(){
    this.rot=0;
    if(this.st==='fall'){this.st='down';this.downT=this.dead?1e9:0.7;this.vx*=0.5;this.setAnim('lie');fxDust(this.x,GROUND,1.4*this.sc);sfx('thud');addShake(6);}
    else{this.st='free';this.anim=null;this.vx=0;fxDust(this.x,GROUND,0.5);}
  }

function fxSpark(x,y,dir,blocked,big){
  const n=blocked?14:big?22:16;

  parts.push({k:'f',x,y,life:0,max:0.13,r:blocked?28:big?50:38,col:blocked?'200,230,255':'255,210,140'});
}
function fxDust(x,y,s){for(let i=0;i<10*s;i++){const a=PI+Math.random()*PI;parts.push({k:'d',x:x+(Math.random()-0.5)*40,y:y-2,vx:Math.cos(a)*90*s*Math.random()*2,vy:-Math.random()*40,life:0,max:0.5+Math.random()*0.4,r:6+Math.random()*10*s});}}
function updFx(dt){for(const p of parts){p.life+=dt;if(p.k==='s'){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}else if(p.k==='d'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.r+=dt*18;}else if(p.k==='e'){p.x+=p.vx*dt+Math.sin(p.life*6+p.r)*0.3;p.y+=p.vy*dt;}}parts=parts.filter(p=>p.life<p.max);if(parts.length>400)parts.splice(0,parts.length-400);}
function drawFx(){
  for(const p of parts)if(p.k==='d'){const a=(1-p.life/p.max)*0.25;ctx.fillStyle=`rgba(120,110,95,${a.toFixed(3)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,PI*2);ctx.fill();}

    else if(p.k==='e'){ctx.globalAlpha=u;ctx.fillStyle='#ffb060';ctx.fillRect(p.x,p.y,2,2);}

}

const G={mode:'menu',round:1,wins:[0,0],timer:60,ann:null,koT:0,hitStop:0,shake:0,slow:1,slowT:0,paused:false,introT:0,winner:-1,combo:[0,0],comboT:[0,0],aiOff:false,time:0,hintT:0,

class AI{
  constructor(me,op,p){this.me=me;this.op=op;this.p=p;this.plan='idle';this.planT=0.5;this.think=0.6;this.lastOpp=null;this.blockIn=-1;this.chainSeen=null;this.pendChain=0;this.airAtk=false;this.counter=false;me.ai=this;}
  onBlocked(){if(Math.random()<this.p.counter)this.counter=true;}
  update(dt){
    const me=this.me,op=this.op,c=me.ctrl,p=this.p,d=Math.abs(op.x-me.x),jR=me.reach,kR=105*me.sc;
    const F=me.face>0?'right':'left',B=me.face>0?'left':'right';
    if((op.st==='attack'||op.st==='airatk')&&op.anim&&op.anim.mv.act){if(this.lastOpp!==op.anim){this.lastOpp=op.anim;if(d<op.reach+90&&Math.random()<p.block&&me.st==='free'){this.blockIn=p.react*(0.35+Math.random()*0.45);this.blockType=op.anim.mv.type;}}}
    if(this.blockIn>=0){this.blockIn-=dt;if(this.blockIn<0){this.plan=this.blockType==='low'?'cblock':'block';this.planT=0.32+Math.random()*0.2;this.think=Math.max(this.think,0.15);}}
    this.planT-=dt;this.think-=dt;
    let press=null,dir='n';
    const an=me.anim;
    if(me.st==='attack'&&an&&an.ci!=null&&an.ci<me.W.combo.length-1&&an.mv.cancel&&this.chainSeen!==an){this.chainSeen=an;if(Math.random()<p.combo)this.pendChain=Math.max(0.01,(an.mv.cancel-an.t)/1000/an.sp)+0.02;}
    if(this.pendChain>0){this.pendChain-=dt;if(this.pendChain<=0)press='J';}
    if(this.counter&&me.st==='free'){this.counter=false;press='J';dir=d>jR*0.9?'fwd':'n';}
    if(me.st==='air'&&this.airAtk&&me.vy>-260&&!(me.C.flip&&me.rot<PI*1.6)){press=Math.random()<0.55?'J':'K';this.airAtk=false;}
    if(this.planT<=0&&this.plan!=='idle')this.plan='idle';
    if(!press&&this.planT<=0&&this.think<=0&&me.st==='free'){
      const r=Math.random(),opDown=!op.vulnerable();
      if(opDown){this.plan=d>jR+10?'approach':'idle';this.planT=0.25;this.think=0.2;}
      else if(p.acro>0&&Math.random()<p.acro*0.3&&d<jR+220){this.plan=d<jR*0.75&&Math.random()<0.5?'jumpB':'jumpF';this.airAtk=this.plan==='jumpF'||Math.random()<0.3;this.planT=0.14;this.think=0.3;this.jumpEdge=true;}
      else if(d>jR+25){if(Math.random()<0.05+0.1*p.aggr&&d<jR+210){this.plan='jumpF';this.jumpEdge=true;this.airAtk=true;this.planT=0.14;}else{this.plan='approach';this.planT=0.15+Math.random()*0.35;}this.think=0.05;}
      else if(r<p.aggr){const opts=[],kw=p.kick||1;
        if(d<jR+5)opts.push(['J','n',3],['J','down',1.3],['J','up',1.0]);
        if(d>=jR*0.55&&d<jR+70)opts.push(['J','fwd',2.0]);
        if(d>=90&&d<kR+25)opts.push(['K','fwd',0.8*kw]);
        if(d<kR)opts.push(['K','n',1.6*kw],['K','down',1.0*kw],['K','up',0.6*kw]);
        if(op.crouching&&d<jR)opts.push(['J','up',2.2]);
        if(op.blocking&&!op.crouching&&d<jR)opts.push(['J','down',1.5],['K','down',d<kR?1.2*kw:0]);
        let tot=0;for(const o of opts)tot+=o[2];let q=Math.random()*tot;
        for(const o of opts){q-=o[2];if(q<=0){press=o[0];dir=o[1];break;}}
        if(!press){this.plan='approach';this.planT=0.2;}
        this.think=0.22+(1-p.aggr)*0.6*Math.random()+p.react*0.6;}
      else if(r<p.aggr+0.2){this.plan='block';this.planT=0.3+Math.random()*0.35;this.think=0.1;}
      else if(r<p.aggr+0.3&&d<jR*0.8){this.plan='retreat';this.planT=0.2+Math.random()*0.2;this.think=0.1;}
      else{this.plan=d>jR*0.85?'approach':'idle';this.planT=0.2+Math.random()*0.2;this.think=0.1;}
    }
    c.left=c.right=c.up=c.down=false;
    switch(this.plan){case 'approach':c[F]=true;break;case 'retreat':case 'block':c[B]=true;break;case 'cblock':c[B]=true;c.down=true;break;
      case 'jumpF':c[F]=true;if(this.jumpEdge){c.up=true;this.jumpEdge=false;}break;case 'jumpB':c[B]=true;if(this.jumpEdge){c.up=true;this.jumpEdge=false;}break;}
    if(press){c.left=c.right=c.up=c.down=false;if(dir==='up')c.up=true;else if(dir==='down')c.down=true;else if(dir==='fwd')c[F]=true;if(press==='J')c.strikeEdge=true;else c.kickEdge=true;this.plan='idle';}
  }
}

  else{b.hp=Math.max(0,b.hp-dmg);b.hpLagT=0.45;const kd=b.hp<=0||mv.kd||b.st==='air'||b.st==='airatk';
    if(kd){b.dead=b.hp<=0;b.knockdown(a.face*(mv.push*0.7+140));}else b.hitStun(0.26+mv.dmg*0.012,a.face*mv.push/Math.max(0.8,b.sc));

    const s=a.side;if(G.human[s]){G.combo[s]=G.comboT[s]>0?G.combo[s]+1:1;G.comboT[s]=1.0;}}
}
function tryHit(a,b){const an=a.anim;if(!an||!an.mv.act||an.hit)return;if(an.t<an.mv.act[0]||an.t>an.mv.act[1])return;if(!b.vulnerable())return;
  const bx=b.hurtbox();for(const p of a.weaponPts()){if(p.x>bx.x0&&p.x<bx.x1&&p.y>bx.y0&&p.y<bx.y1){an.hit=true;applyHit(a,b,an.mv,p);return;}}}
function resolve(){

const HINTS={single:'Назад — блок · ▼ — присед · Вперёд+Удар — выпад · ▲+Удар — сверху · ▼+Удар — подсечка · Удар×N — серия',pvp:'Назад — блок · Вперёд+Удар — выпад · ▲/▼+Удар — сверху/подсечка · Удар×N — серия'};
let hintShown=false;
function update(rdt){
  G.time+=rdt;if(G.ann)G.ann.t+=rdt;

  const wantHint=S.hints&&G.hintT>0&&(G.mode==='fight'||G.mode==='intro');
  if(wantHint!==hintShown){hintShown=wantHint;const h=$('hint');if(wantHint){h.textContent=(G.game.type==='pvp'&&!isTouch)?'И1: WASD + F/G · И2: стрелки + K/L · назад — блок':(isTouch||G.forceTouchUI)?HINTS[G.game.type==='pvp'?'pvp':'single']:'←→/AD — ходьба · назад — блок · J/F — удар · K/G — нога · P — пауза';}h.classList.toggle('on',wantHint);}
  if(G.hitStop>0){G.hitStop-=rdt;updFx(rdt*0.25);return;}

  const dt=rdt*G.slow;
  for(let s=0;s<2;s++){const F=FS[s],c=F.ctrl;
    if(G.mode==='fight'){if(G.human[s]){const I=IN[s];c.left=!!(I.kL||I.jL);c.right=!!(I.kR||I.jR);c.up=!!(I.kU||I.jU);c.down=!!(I.kD||I.jD);if(I.st)c.strikeEdge=true;if(I.kk)c.kickEdge=true;}
      else if(ais[s]&&!G.aiOff)ais[s].update(dt);else{c.left=c.right=c.up=c.down=false;}}
    else{c.left=c.right=c.up=c.down=false;c.strikeEdge=c.kickEdge=false;}}
  for(const I of IN){I.st=I.kk=false;}
  P1.update(dt,P2);P2.update(dt,P1);
  for(const F of FS){F.ctrl.strikeEdge=F.ctrl.kickEdge=false;}
  resolve();
  if(G.mode==='fight'){tryHit(P1,P2);tryHit(P2,P1);}
  for(let s=0;s<2;s++)if(G.comboT[s]>0)G.comboT[s]-=dt;
  if(G.mode==='intro'){G.introT+=rdt;if(G.introT>=1.45){G.mode='fight';announce('Бой!','',0.75,76);sfx('gong');}}
  else if(G.mode==='fight'){G.timer=Math.max(0,G.timer-dt);
    if(P1.hp<=0||P2.hp<=0){G.mode='ko';G.koT=0;G.slow=0.3;G.slowT=0.9;G.winner=P1.hp<=0&&P2.hp<=0?-1:P2.hp<=0?0:1;announce('Нокаут!','',1.6,72);}
    else if(G.timer<=0){G.mode='ko';G.koT=0;const r1=P1.hp/P1.maxHp,r2=P2.hp/P2.maxHp;G.winner=Math.abs(r1-r2)<0.001?-1:r1>r2?0:1;announce('Время!',G.winner<0?'Ничья':'',1.6,68);}}
  else if(G.mode==='ko'){G.koT+=rdt;
    if(G.koT>1.6&&G.winner>=0&&!G.winShown){const w=FS[G.winner];if(w.st==='free'){w.setAnim('win','win');G.winShown=true;
      const pvp=G.game.type==='pvp';announce(pvp?`Раунд за Игроком ${G.winner+1}`:G.winner===0?'Победа':'Поражение',pvp?w.name:G.winner===0?'Раунд за тобой':`Раунд за ${w.dispName||w.name}`,1.4,pvp?44:58);}}
    if(G.koT>3.3){G.winShown=false;endRound();}}
  updFx(dt);
  for(const x of TORCHES)if(Math.random()<dt*6)parts.push({k:'e',x:x+(Math.random()-0.5)*10,y:GROUND-140,vx:(Math.random()-0.5)*20,vy:-40-Math.random()*50,life:0,max:1+Math.random(),r:Math.random()*6});
  const tgt=clamp((P1.x+P2.x)/2-viewW/2,0,WORLD_W-viewW);camX+=(tgt-camX)*Math.min(1,dt*6);
  G.shake*=Math.exp(-rdt*9);if(G.shake<0.2||!S.shake)G.shake=0;
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function bar(x,y,w,h,F,rev){
  ctx.fillStyle='rgba(0,0,0,0.62)';rr(x-3,y-3,w+6,h+6,4);ctx.fill();ctx.strokeStyle='#b8925a';ctx.lineWidth=1.5;ctx.stroke();
  const fr=clamp(F.hp/F.maxHp,0,1),lr=clamp(F.hpLag/F.maxHp,0,1);
  ctx.fillStyle='rgba(255,236,200,0.85)';ctx.fillRect(rev?x+w-w*lr:x,y,w*lr,h);
  const gr=ctx.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#f2743f');gr.addColorStop(0.5,'#c62a1a');gr.addColorStop(1,'#6e120c');ctx.fillStyle=gr;ctx.fillRect(rev?x+w-w*fr:x,y,w*fr,h);
  ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x,y,w,h*0.4);
}
function drawHUD(){
  const top=offY>0?Math.max(6,offY-66):6,m=16,bw=Math.min(320,viewW*0.36),bh=15,y=top+8,g=G.game,pvp=g.type==='pvp';
  bar(m,y,bw,bh,P1,false);bar(viewW-m-bw,y,bw,bh,P2,true);
  ctx.textBaseline='alphabetic';ctx.fillStyle='#f0e3c3';ctx.shadowColor='#000';ctx.shadowBlur=4;
  ctx.font='bold 14px Georgia,serif';ctx.textAlign='left';ctx.fillText((pvp?'И1 · ':'')+P1.name,m,y+bh+19);ctx.textAlign='right';ctx.fillText((pvp?'И2 · ':'')+(P2.dispName?P2.dispName+' · '+P2.name:P2.name),viewW-m,y+bh+19);
  ctx.font='italic 11px Georgia,serif';ctx.fillStyle='#cbb98f';ctx.textAlign='left';ctx.fillText(WEAPONS[P1.wid].name,m,y+bh+33);ctx.textAlign='right';ctx.fillText(WEAPONS[P2.wid].name,viewW-m,y+bh+33);ctx.shadowBlur=0;
  for(let i=0;i<2;i++){for(const[side,wn]of[[0,G.wins[0]],[1,G.wins[1]]]){const cx=side?viewW-m-bw+8+i*15:m+bw-8-i*15,cy=y+bh+13;ctx.beginPath();ctx.arc(cx,cy,5,0,PI*2);ctx.fillStyle=wn>i?'#f0c060':'rgba(0,0,0,0.5)';ctx.fill();ctx.strokeStyle='#b8925a';ctx.lineWidth=1.2;ctx.stroke();}}
  const cx=viewW/2;ctx.fillStyle='rgba(0,0,0,0.62)';ctx.beginPath();ctx.moveTo(cx-26,y-5);ctx.lineTo(cx+26,y-5);ctx.lineTo(cx+24,y+24);ctx.lineTo(cx,y+36);ctx.lineTo(cx-24,y+24);ctx.closePath();ctx.fill();ctx.strokeStyle='#b8925a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.textAlign='center';ctx.font='bold 22px Georgia,serif';ctx.fillStyle=G.timer<10?'#ff7a5a':'#f3e2bb';ctx.fillText(String(Math.ceil(G.timer)),cx,y+20);
  ctx.font='11px Georgia,serif';ctx.fillStyle='#cbb98f';ctx.fillText(g.type==='story'?`Глава ${g.ch+1} · Раунд ${G.round}`:g.type==='ranked'?`Рейтинг · 🏆 ${g.opp.tr} · Раунд ${G.round}`:pvp?`Два игрока · Раунд ${G.round}`:`Против ИИ · Раунд ${G.round}`,cx,y+52);
  for(let s=0;s<2;s++)if(G.combo[s]>1&&G.comboT[s]>0){ctx.globalAlpha=Math.min(1,G.comboT[s]*2);ctx.textAlign=s?'right':'left';ctx.font='bold italic 18px Georgia,serif';ctx.fillStyle='#ffd27a';ctx.shadowColor='#000';ctx.shadowBlur=5;const n=G.combo[s];ctx.fillText(`${n} ${n>=5?'ударов':'удара'} подряд!`,s?viewW-m:m,y+bh+56);ctx.shadowBlur=0;ctx.globalAlpha=1;}
}
function drawAnn(){const a=G.ann;if(!a)return;const p=a.t/a.dur;if(p>=1){G.ann=null;return;}
  const cx=viewW/2,cy=offY+185,sIn=Math.min(1,a.t/0.18),al=p>0.78?(1-p)/0.22:1,sc=1+(1-ease(sIn))*0.7;
  ctx.save();ctx.globalAlpha=clamp(al,0,1);ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`bold ${a.size}px Georgia,serif`;ctx.lineWidth=8;ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineJoin='round';ctx.strokeText(a.text,0,0);
  const gr=ctx.createLinearGradient(0,-a.size/2,0,a.size/2);gr.addColorStop(0,'#fff3d0');gr.addColorStop(0.55,'#e0a84a');gr.addColorStop(1,'#8a5418');ctx.fillStyle=gr;ctx.fillText(a.text,0,0);
  if(a.sub){ctx.font='italic 19px Georgia,serif';ctx.lineWidth=5;ctx.strokeText(a.sub,0,a.size*0.62+6);ctx.fillStyle='#efe0bd';ctx.fillText(a.sub,0,a.size*0.62+6);}
  ctx.restore();}
function drawMarkers(){if(G.game.type!=='pvp'||G.mode==='menu')return;for(const F of FS){const J=F.J,x=J.head.x,y=J.head.y-SK.HR*F.sc-26;ctx.fillStyle=F.side?'rgba(255,110,80,0.9)':'rgba(120,190,255,0.9)';ctx.beginPath();ctx.moveTo(x-7,y-8);ctx.lineTo(x+7,y-8);ctx.lineTo(x,y);ctx.closePath();ctx.fill();ctx.font='bold 11px Georgia,serif';ctx.textAlign='center';ctx.fillText(F.side?'2':'1',x,y-11);}}
function render(rdt){
  const s=scale*dpr;ctx.setTransform(s,0,0,s,0,0);const time=G.time;
  const hy=offY+300;let gr=ctx.createLinearGradient(0,Math.min(0,offY),0,hy+40);gr.addColorStop(0,'#18202c');gr.addColorStop(0.42,'#4a5566');gr.addColorStop(0.78,'#a99c8b');gr.addColorStop(1,'#dcb88e');ctx.fillStyle=gr;ctx.fillRect(0,0,viewW,viewH);
  const sunX=viewW*0.66-camX*0.03,sunY=offY+205;gr=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,300);gr.addColorStop(0,'rgba(255,224,170,0.75)');gr.addColorStop(0.08,'rgba(255,214,160,0.5)');gr.addColorStop(1,'rgba(255,200,150,0)');ctx.fillStyle=gr;ctx.fillRect(sunX-300,sunY-300,600,600);
  const sx=(Math.random()-0.5)*G.shake,sy=(Math.random()-0.5)*G.shake;
  ctx.save();ctx.translate(sx,offY+sy);
  for(let i=0;i<layers.length;i++){const L=layers[i];ctx.drawImage(L.c,-camX*L.p-20,0,L.lw,H);if(i===3)drawFog(300,0.7,8,0.8,time);}
  if(offY>0){ctx.fillStyle='#141310';ctx.fillRect(-20,H-1,viewW+40,offY+40);}
  ctx.translate(-camX,0);
  for(const x of TORCHES)drawTorch(x,time);
  drawFighter(P2);drawFighter(P1);
  drawMarkers();
  drawFx();
  drawSnow(rdt,time);
  ctx.translate(camX,0);
  drawFog(352,1.15,16,0.55,time);
  ctx.restore();
  ctx.drawImage(vigImg,0,0,viewW,viewH);
  if(G.mode!=='menu'&&G.mode!=='result')drawHUD();
  drawAnn();
}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let rdt=(now-last)/1000;last=now;if(!(rdt>0))rdt=0.016;rdt=Math.min(0.05,rdt);
  try{if(!G.paused)update(rdt);render(G.paused?0:rdt);musicTick();}catch(err){console.error(err);}}
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,100);});
addEventListener('orientationchange',()=>setTimeout(resize,250));
applySettings();resize();scrMenu();requestAnimationFrame(frame);
window.__game={G,IN,AI,get FS(){return FS;},makeAI:(s)=>{ais[s]=new AI(FS[s],FS[1-s],aiParams(G.game,s));G.human[s]=false;},CHARS,WEAPONS,BALANCE,STORY,get S(){return S;},get PR(){return PR;},get RK(){return RK;},scrSearch,scrProfile,LEAGUES,trophyDelta,get P1(){return P1;},get P2(){return P2;},get ais(){return ais;},startMatch,scrMenu,scrStory,scrIntro,scrMp,mpFlow,scrSettings,unlocks};
})();
